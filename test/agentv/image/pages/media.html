<!doctype html>
<!-- A stand-in for a streaming app in the image checks: a quiet tone that
     starts on the first key press, as a film starts on OK. -->
<html lang="en">
<head><meta charset="utf-8"><title>media page</title></head>
<body style="margin:0;background:#1a1b26;color:#c0caf5;font:96px monospace">
<p style="margin:64px">media page</p>
<script>
  const rate = 8000, samples = rate;
  const data = new DataView(new ArrayBuffer(44 + samples * 2));
  const text = (at, s) => [...s].forEach((c, i) => data.setUint8(at + i, c.charCodeAt(0)));
  text(0, "RIFF"); data.setUint32(4, 36 + samples * 2, true); text(8, "WAVEfmt ");
  data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 1, true);
  data.setUint32(24, rate, true); data.setUint32(28, rate * 2, true); data.setUint16(32, 2, true);
  data.setUint16(34, 16, true); text(36, "data"); data.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++) data.setInt16(44 + i * 2, Math.sin(i / 8) * 200, true);
  const audio = Object.assign(document.createElement("audio"), { src: URL.createObjectURL(new Blob([data], { type: "audio/wav" })), loop: true });
  document.body.append(audio);
  addEventListener("keydown", () => audio.paused && audio.play(), { once: true });
</script>
</body>
</html>
