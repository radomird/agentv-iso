name: ISO

# Builds AgenTV's ISO and installs it in a VM (ADR-019, layer 5). The ISO is
# omarchy-iso's own build with Omarchy's own packages; the only addition is
# AgenTV's signed packages, which configs/airootfs/root/customize_airootfs.sh
# adds to the offline mirror and the install (ADR-025). Then upstream's own
# install test (an unattended install in QEMU with KVM and a boot of the
# installed system), then AgenTV's image checks in test/agentv/image/.
#
# It runs on pull requests that touch the build, once they're ready for
# review (the gate job below says when), on release tags and by hand. A
# merge to agentv doesn't rebuild it: the nightly run in agentv-os builds the
# edge ISO every night, from this branch.
#
# A release tag is agentv-v1.0.0, a candidate's agentv-v1.0.0-rc1, and a 0.x
# release was v0.2.0 (bin/agentv-iso-tag). A release's ISO carries stable's
# packages, and a candidate's carries edge's. Either way the run first
# checks that the package is the one the ISO's name promises
# (bin/agentv-iso-carries): the release itself, or for a candidate the
# commit agentv-os tagged with the same name. Any other tag that starts the
# run fails it, and keeps nothing.
#
# The screenshots are always kept. The ISO, about 6.4 GB, is over GitHub's
# 2 GiB cap for release assets, so a tag or a run by hand keeps it as a
# workflow artifact. This workflow has no keys and publishes nothing: when a
# release tag's run passes, publish-iso.yml takes the ISO it kept, signs its
# checksum and puts it in AgenTV's R2 bucket for people to download.

on:
  push:
    tags: ["agentv-v*", "v*"]
  pull_request:
    # ready_for_review: a draft gets no ISO run, so marking it ready is what
    # starts its one full run. labeled: the "image" label asks for one by
    # hand, on a draft too.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "bin/**"
      - "builder/**"
      - "configs/**"
      - "test/**"
      - "archiso"
      - ".github/workflows/iso.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "AgenTV package channel the ISO carries"
        type: choice
        options: [edge, stable]
        default: edge
      keep-iso:
        description: "Keep the ISO as an artifact"
        type: boolean
        default: false
      ref:
        description: "Branch or commit to build (empty: the one this runs on)"
        type: string
        default: ""
      checks:
        description: "Only these image checks, by name, like s5.6-setup update-tv (empty: every check)"
        type: string
        default: ""
  workflow_call:
    inputs:
      channel:
        type: string
        default: edge
      keep-iso:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
      checks:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # Whether a pull request gets an ISO run of its own (ADR-074). Not while
  # it's a draft: marking it ready starts the run, and each push after that
  # runs it again. The "image" label asks for one by hand, on a draft too,
  # and adding it again runs it again. GitHub can't start this workflow for
  # one label and not another, so any other label starts it too, but it
  # runs nothing.
  #
  # Not when agentv-os has an open pull request from a branch of the same
  # name either: agentv-os's VM test builds the ISO from this branch, with
  # that change's packages, so the two are tested together, once, there.
  # That pull request's Check run leaves a notice with the agentv-iso commit
  # it builds, so this job can say whether it builds this one.
  #
  # And not for a sync pull request: omarchy-sync.yml builds its ISO by
  # calling this workflow itself, and building it a second time would only
  # double the wait before it merges. Tags, runs by hand and workflows that
  # call this one don't ask: this job only runs for pull requests.
  gate:
    name: "Does this need an ISO run?"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Decide, and say why
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'image') }}
        run: |
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          run=false
          if [[ $HEAD_REF == omarchy-sync/* ]]; then
            say "No ISO run here: it's an Omarchy sync, and omarchy-sync.yml builds its ISO."
          elif [[ $ACTION == "labeled" && $LABEL != "image" ]]; then
            say "No ISO run for the \`$LABEL\` label. Only the image label starts one."
          elif [[ $LABELED == "true" ]]; then
            run=true
            say "The ISO runs: it has the image label."
          elif [[ $DRAFT == "true" ]]; then
            say "No ISO run yet: it's a draft. Marking it ready starts one, unless agentv-os has an open pull request from \`$HEAD_REF\` too. The image label runs it on a draft."
          else
            if ! pr=$(gh api -X GET "repos/$OWNER/agentv-os/pulls" -f state=open -f head="$OWNER:$HEAD_REF" \
              --jq '.[0] // empty | "\(.number) \(.draft) \(.head.sha)"'); then
              echo "::error::Couldn't ask agentv-os for an open pull request from $HEAD_REF. Rerun this job."
              exit 1
            fi
            if [[ -z $pr ]]; then
              run=true
              say "The ISO runs: it's ready for review, and agentv-os has no open pull request from \`$HEAD_REF\`."
            else
              read -r number os_draft os_sha <<<"$pr"
              url="https://github.com/$OWNER/agentv-os/pull/$number"
              say "No ISO run here: agentv-os [#$number]($url) comes from a branch of the same name, and its VM test builds the ISO from this branch, with that change's packages. So the two are tested together, once, there."
              say ""
              if [[ $os_draft == "true" ]]; then
                say "agentv-os #$number is a draft, so its VM test runs when it's marked ready."
              else
                notes=""
                check=$(gh api -X GET "repos/$OWNER/agentv-os/commits/$os_sha/check-runs" -f check_name="Does this need a VM test?" \
                  --jq '.check_runs | sort_by(.started_at) | last | .id // empty') || check=""
                if [[ -n $check ]]; then
                  notes=$(gh api "repos/$OWNER/agentv-os/check-runs/$check/annotations" --jq '.[].message') || notes=""
                fi
                if grep -q "$HEAD_SHA" <<<"$notes"; then
                  say "Its latest Check run builds this commit, \`${HEAD_SHA::7}\`: [its checks]($url/checks)."
                else
                  say "Its latest Check run, on agentv-os \`${os_sha::7}\`, doesn't build this commit, \`${HEAD_SHA::7}\`. A push to agentv-os's branch starts one that does. Without one, rerun agentv-os #$number's Check run from [its checks]($url/checks), once it isn't running."
                  echo "::warning::agentv-os #$number's VM test doesn't build this commit yet. Push its branch, or rerun its Check run."
                fi
              fi
            fi
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

  iso:
    name: "Build the ISO, install it, boot it, check it"
    needs: gate
    # A pull request runs it when the gate says so. Tags, runs by hand and
    # workflows that call this one always do.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.gate.outputs.run == 'true') }}
    # Here, not on the workflow: a run whose gate says no, like another
    # label, would otherwise cancel the run already going.
    concurrency:
      group: iso-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
          persist-credentials: false

      # A pushed tag is the only push that starts this workflow. It has to
      # be one of AgenTV's release tags, and it says which packages the ISO
      # carries: stable's for a release, edge's for a candidate. Every other
      # run carries the channel it was asked for, edge unless told. Only an
      # ISO that went through every check is kept: a release tag's always,
      # another run's when it asks.
      - name: Which packages, and whether the ISO is kept
        env:
          ASKED: ${{ inputs.channel }}
          KEEP: ${{ inputs.keep-iso }}
          ONLY: ${{ inputs.checks }}
        run: |
          tag=""
          if [[ $GITHUB_EVENT_NAME == "push" ]]; then
            tag=$GITHUB_REF_NAME
            read -r kind version < <(bin/agentv-iso-tag "$tag") || {
              echo "::error::$tag isn't one of AgenTV's release tags, so no ISO is built for it. A release is agentv-v1.0.0 and a candidate agentv-v1.0.0-rc1."
              exit 1
            }
            channel=edge
            [[ $kind != "stable" ]] || channel=stable
            keep=true
            echo "ISO_VERSION=$version" >>"$GITHUB_ENV"
            echo "$tag is AgenTV $version, for the $kind channel. Its ISO carries the $channel packages." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            channel=${ASKED:-edge}
            keep=${KEEP:-false}
          fi
          [[ -z $ONLY ]] || keep=false
          {
            echo "RELEASE_TAG=$tag"
            echo "CHANNEL=$channel"
            echo "KEEP_ISO=$keep"
          } >>"$GITHUB_ENV"

      # The build and the install need about 40 GB. GitHub's runner ships
      # toolchains this job never uses, so make room when it's short.
      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          echo "Free: $(avail) GB"
          if (( $(avail) < 45 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
            echo "Free after clean-up: $(avail) GB"
          fi
          (( $(avail) >= 40 )) || { echo "::error::only $(avail) GB free, the build and install test need about 40 GB"; exit 1; }

      - name: Fetch AgenTV's signed packages
        env:
          AGENTV_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          bin/agentv-iso-packages "$CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"

      # Before the long build: a release tag's ISO is named after the tag,
      # so the package on it has to be the one that name promises.
      - name: The packages are the ones the tag stands for
        if: env.RELEASE_TAG != ''
        env:
          AGENTV_OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          bin/agentv-iso-carries "$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Upstream's own build and install test, then AgenTV's checks against
      # the base image it leaves behind (test/agentv/image/ci).
      - name: Build, install, boot, check
        env:
          AGENTV_OWNER: ${{ github.repository_owner }}
          # Two VMs at a time (test/agentv/image/run).
          AGENTV_TEST_LANES: 2
          ONLY: ${{ inputs.checks }}
        run: |
          set -o pipefail
          read -ra checks <<<"$ONLY"
          if (( ${#checks[@]} > 0 )); then
            echo "Only these checks run: ${checks[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          test/agentv/image/ci "${checks[@]}" 2>&1 | tee image.log

      - name: Report
        if: always()
        run: |
          result() {
            if grep -q "not ok - $1 " image.log 2>/dev/null; then echo fail
            elif grep -q "^ok - $1 " image.log 2>/dev/null; then echo pass
            else echo "not run"; fi
          }
          base=$(ls -d test-runs/*-integration 2>/dev/null | head -1 || true)
          {
            echo "## ISO"
            echo
            echo "AgenTV packages: \`$CHANNEL\`. Build: $(cat test-runs/build-seconds 2>/dev/null || echo ?) s."
            if [[ -n $base && -f $base/omarchy-install-timing.json ]]; then
              jq -r '"Install: \((.finished_at - .started_at) | round) s."' "$base/omarchy-install-timing.json"
            fi
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          test/agentv/report iso "S0.1=$(result S0.1)" "S0.4=$(result S0.4)" \
            "S1.1=$(result S1.1)" "S1.3=$(result S1.3)" "S1.6=$(result S1.6)" "S1.7=$(result S1.7)" \
            "T1.1=$(result T1.1)" "T1.2=$(result T1.2)" "T1.4=$(result T1.4)" \
            "T2.1=$(result T2.1)" "T2.2=$(result T2.2)" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            test-runs/build-seconds
            test-runs/*/*.png
            test-runs/*/serial.log
            test-runs/*/omarchy-install-timing.json
            test-runs/*/omarchy-install.log
            test-runs/*/first-boot-systemd-analyze.txt
            test-runs/*/runs/**/*.png
            test-runs/*/runs/**/*.txt
            test-runs/*/runs/**/*.json
            test-runs/*/runs/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      # The name people download (ADR-027), given only now: upstream's test
      # harness reads which packages the ISO has from its file name.
      - name: Name the ISO
        if: success() && env.KEEP_ISO == 'true'
        id: name
        run: |
          # A release tag's own run is named for the tag's version. Any
          # other run, one started by hand on a tag too, is named for the
          # commit it built, which isn't always the one it runs on.
          if [[ -n $RELEASE_TAG ]]; then
            name="agentv-$ISO_VERSION-x86_64"
          else
            name="agentv-edge-$(git rev-parse HEAD | cut -c1-7)-x86_64"
          fi
          mv release/*.iso "release/$name.iso"
          (cd release && sha256sum "$name.iso" >"$name.iso.sha256")
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "ISO: \`$name.iso\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the ISO
        if: success() && env.KEEP_ISO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            release/*.iso
            release/*.iso.sha256
          compression-level: 0
          retention-days: 30

      # The checksum on its own too, a few bytes: publish-iso.yml signs it
      # without fetching the ISO.
      - name: Keep the checksum
        if: success() && env.KEEP_ISO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}.sha256
          path: release/*.iso.sha256
          if-no-files-found: error
          retention-days: 30
