name: ISO

# Builds AgenTV's ISO and installs it in a VM (ADR-019, layer 5). The ISO is
# omarchy-iso's own build with Omarchy's own packages; the only addition is
# AgenTV's signed packages, which configs/airootfs/root/customize_airootfs.sh
# adds to the offline mirror and the install (ADR-025). Then upstream's own
# install test (an unattended install in QEMU with KVM and a boot of the
# installed system), then AgenTV's image checks in test/agentv/image/.
#
# It runs on pull requests that touch the build, on release tags and by hand.
# A merge to agentv doesn't rebuild it: the nightly run in agentv-os builds
# the edge ISO every night, from this branch.
#
# The screenshots are always kept. The ISO, about 6.4 GB, is over GitHub's
# 2 GiB cap for release assets, so a tag or a run by hand keeps it as a
# workflow artifact instead.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "bin/**"
      - "builder/**"
      - "configs/**"
      - "test/**"
      - "archiso"
      - ".github/workflows/iso.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "AgenTV package channel the ISO carries"
        type: choice
        options: [edge, stable]
        default: edge
      keep-iso:
        description: "Keep the ISO as an artifact"
        type: boolean
        default: false
      ref:
        description: "Branch or commit to build (empty: the one this runs on)"
        type: string
        default: ""
  workflow_call:
    inputs:
      channel:
        type: string
        default: edge
      keep-iso:
        type: boolean
        default: false
      ref:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: iso-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: "Build the ISO, install it, boot it, check it"
    # A sync pull request's ISO is built by omarchy-sync.yml, which calls this
    # workflow itself; building it a second time for the pull request would
    # only double the wait before it merges.
    if: ${{ !startsWith(github.head_ref, 'omarchy-sync/') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      # A release tag carries stable packages; everything else edge.
      CHANNEL: ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/v') && 'stable') || 'edge' }}
      KEEP_ISO: ${{ inputs.keep-iso || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
          persist-credentials: false

      # The build and the install need about 40 GB. GitHub's runner ships
      # toolchains this job never uses, so make room when it's short.
      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          echo "Free: $(avail) GB"
          if (( $(avail) < 45 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
            echo "Free after clean-up: $(avail) GB"
          fi
          (( $(avail) >= 40 )) || { echo "::error::only $(avail) GB free, the build and install test need about 40 GB"; exit 1; }

      - name: Fetch AgenTV's signed packages
        env:
          AGENTV_OWNER: ${{ github.repository_owner }}
        run: bin/agentv-iso-packages "$CHANNEL"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Upstream's own build and install test, then AgenTV's checks against
      # the base image it leaves behind (test/agentv/image/ci).
      - name: Build, install, boot, check
        env:
          AGENTV_OWNER: ${{ github.repository_owner }}
        run: set -o pipefail; test/agentv/image/ci 2>&1 | tee image.log

      - name: Report
        if: always()
        run: |
          result() {
            if grep -q "not ok - $1 " image.log 2>/dev/null; then echo fail
            elif grep -q "^ok - $1 " image.log 2>/dev/null; then echo pass
            else echo "not run"; fi
          }
          base=$(ls -d test-runs/*-integration 2>/dev/null | head -1 || true)
          {
            echo "## ISO"
            echo
            echo "AgenTV packages: \`$CHANNEL\`. Build: $(cat test-runs/build-seconds 2>/dev/null || echo ?) s."
            if [[ -n $base && -f $base/omarchy-install-timing.json ]]; then
              jq -r '"Install: \((.finished_at - .started_at) | round) s."' "$base/omarchy-install-timing.json"
            fi
            echo
          } >>"$GITHUB_STEP_SUMMARY"
          test/agentv/report iso "S0.1=$(result S0.1)" "S0.4=$(result S0.4)" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            test-runs/build-seconds
            test-runs/*/*.png
            test-runs/*/serial.log
            test-runs/*/omarchy-install-timing.json
            test-runs/*/omarchy-install.log
            test-runs/*/first-boot-systemd-analyze.txt
            test-runs/*/runs/**/*.png
            test-runs/*/runs/**/*.txt
            test-runs/*/runs/**/*.json
            test-runs/*/runs/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      # The name people download (ADR-027), given only now: upstream's test
      # harness reads which packages the ISO has from its file name.
      - name: Name the ISO
        if: success() && env.KEEP_ISO == 'true'
        id: name
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name="agentv-${GITHUB_REF_NAME#v}-x86_64"
          else
            name="agentv-edge-${GITHUB_SHA::7}-x86_64"
          fi
          mv release/*.iso "release/$name.iso"
          (cd release && sha256sum "$name.iso" >"$name.iso.sha256")
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "ISO: \`$name.iso\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the ISO
        if: success() && env.KEEP_ISO == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            release/*.iso
            release/*.iso.sha256
          compression-level: 0
          retention-days: 30
