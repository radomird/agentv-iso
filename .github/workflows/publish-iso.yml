name: Publish ISO

# Puts an ISO that passed its checks where people download it: AgenTV's
# Cloudflare R2 bucket, since the ISO is over GitHub's 2 GiB cap for release
# files. The bucket holds one ISO for each channel, each named by its
# version, such as agentv-1.0.0-x86_64.iso (bin/agentv-iso-publish):
#
#   stable  the latest release, from a tag like v1.0.0
#   rc      the latest release candidate, from a tag like v1.0.0-rc1
#   edge    last night's build, from agentv-os's nightly run
#
# Beside them, stable.json, rc.json and edge.json say which ISO each
# channel is on. Those are the links that don't change. Publishing an ISO
# moves its channel's file to it, last of all, and then the ISO the channel
# had before is removed.
#
# It starts three ways. When the ISO workflow finishes a release tag's run,
# it publishes that run's ISO as stable or rc. Every morning it looks for
# the edge ISO the night's run in agentv-os kept, and publishes it when it's
# a new one. And by hand, for an ISO one of those two kinds of run kept: a
# release tag's, or a scheduled night's. Never one from a run started by
# hand, which can build a branch that isn't merged.
#
# It always runs from the agentv branch, never from the tag or the branch
# that built the ISO, so the build never has the bucket's keys or the
# signing key. Four jobs:
#
#   which    works out which ISO, with no secrets
#   sum      fetches the ISO's checksum and checks it names a channel's ISO
#   sign     has AgenTV's signing key and does nothing but sign that file
#   publish  has the bucket's keys: uploads, checks, and cleans up
#
# sign and publish read their secrets through the "release" environment,
# which only agentv may use: AGENTV_SIGNING_KEY for sign, and
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY for publish. The
# variables R2_BUCKET and ISO_URL say where the bucket is.

on:
  workflow_run:
    workflows: [ISO]
    types: [completed]
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel's ISO this one becomes"
        type: choice
        options: [edge, stable, rc]
        required: true
      repo:
        description: "The repo whose run kept the ISO"
        type: choice
        options: [agentv-iso, agentv-os]
        default: agentv-iso
      run-id:
        description: "The run that kept the ISO"
        type: string
        required: true
      name:
        description: "The kept ISO's name, such as agentv-1.0.0-x86_64"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-iso
  cancel-in-progress: false

jobs:
  which:
    name: "Which ISO?"
    # A run of the ISO workflow counts only when it was a tag's and it passed.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the run a release tag or a run by hand takes the ISO from.
      actions: read
    outputs:
      publish: ${{ steps.which.outputs.publish }}
      channel: ${{ steps.which.outputs.channel }}
      repo: ${{ steps.which.outputs.repo }}
      run-id: ${{ steps.which.outputs.run-id }}
      name: ${{ steps.which.outputs.name }}
    steps:
      # The default branch's own script, which says whether a nightly's leg
      # passed. No secrets here, and nothing of the run being published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: bin
          persist-credentials: false
      - name: Decide, and say why
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          TAG_RUN: ${{ github.event.workflow_run.id }}
          TAG_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_REPO: ${{ inputs.repo }}
          IN_RUN: ${{ inputs.run-id }}
          IN_NAME: ${{ inputs.name }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ISO_URL: ${{ vars.ISO_URL }}
        run: |
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          skip() { say "$*"; echo "publish=false" >>"$GITHUB_OUTPUT"; exit 0; }

          [[ -n $R2_BUCKET && -n $ISO_URL ]] || skip "Nothing is published: this repo's R2_BUCKET and ISO_URL variables aren't set."

          case $EVENT in
            workflow_run)
              # The ISO workflow only runs for a push when it's a tag's.
              [[ $TAG_REPO == "$GITHUB_REPOSITORY" ]] || skip "Nothing is published: that run wasn't this repo's."
              if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                channel=stable
              elif [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
                channel=rc
              else
                skip "Nothing is published: \`$TAG\` isn't a release tag (v1.0.0) or a release candidate's (v1.0.0-rc1)."
              fi
              repo=agentv-iso
              run=$TAG_RUN
              name="agentv-${TAG#v}-x86_64"
              ;;
            schedule)
              # The edge ISO agentv-os's newest finished nightly run kept. A
              # night with a failed check keeps none: its last job takes the
              # ISO back, and the leg is asked about below as well. Only a run
              # the schedule started counts: one started by hand can check
              # with an agentv-iso branch that isn't merged.
              channel=edge
              repo=agentv-os
              run=$(gh api "repos/$OWNER/agentv-os/actions/workflows/nightly.yml/runs?branch=agentv&event=schedule&status=completed&per_page=1" \
                --jq '.workflow_runs[0].id // empty')
              [[ -n $run ]] || skip "Nothing is published: agentv-os has no finished nightly run."
              name=$(gh api "repos/$OWNER/agentv-os/actions/runs/$run/artifacts?per_page=100" --paginate \
                --jq '.artifacts[] | select(.expired == false and (.name | test("^agentv-(edge-[0-9.]+-[0-9a-f]{7}|[0-9]+[.][0-9]+[.][0-9]+[.]r[0-9]+[.]g[0-9a-f]+)-x86_64$"))) | .name' | head -n 1)
              [[ -n $name ]] || skip "Nothing is published: agentv-os's newest nightly run ($run) kept no edge ISO."
              # The second lock, which doesn't lean on that last job: a run
              # that was cancelled, or never got as far as taking its ISO
              # back, still has one. The edge leg has to have passed.
              passed=$(gh api "repos/$OWNER/agentv-os/actions/runs/$run/jobs?filter=latest&per_page=100" --paginate --jq '.jobs[]' | bin/agentv-iso-passed edge) ||
                skip "Nothing is published from agentv-os's newest nightly run ($run), though it kept an edge ISO. ${passed:-Its jobs couldn't be read.}"
              # Published already?
              version=${name#agentv-}
              version=${version%-x86_64}
              served=$(curl -fsSL --retry 2 "${ISO_URL%/}/iso/edge.json?run=$GITHUB_RUN_ID" | jq -r '.version // empty' || true)
              [[ $served != "$version" ]] || skip "Nothing to do: the edge ISO people download is \`$version\` already."
              ;;
            workflow_dispatch)
              channel=$IN_CHANNEL
              repo=$IN_REPO
              run=$IN_RUN
              name=$IN_NAME
              ;;
            *) skip "Nothing is published for $EVENT." ;;
          esac

          [[ $channel =~ ^(edge|stable|rc)$ ]] || { echo "::error::the channel is edge, stable or rc"; exit 1; }
          [[ $repo =~ ^agentv-(iso|os)$ ]] || { echo "::error::the repo is agentv-iso or agentv-os"; exit 1; }
          [[ $run =~ ^[0-9]+$ ]] || { echo "::error::run-id is a run's number"; exit 1; }
          [[ $name =~ ^agentv-[A-Za-z0-9.]+(-[A-Za-z0-9.]+)*-x86_64$ ]] || { echo "::error::name is an ISO's name, such as agentv-1.0.0-x86_64"; exit 1; }
          {
            echo "publish=true"
            echo "channel=$channel"
            echo "repo=$repo"
            echo "run-id=$run"
            echo "name=$name"
          } >>"$GITHUB_OUTPUT"
          say "Publishing \`$name\` from $repo's run $run as the $channel ISO."

      # A release tag's run, and a run named by hand, are looked at before
      # anything is fetched, signed or uploaded (bin/agentv-iso-kept): which
      # repo and workflow made it, what started it and on what, whether it
      # passed, and whether the ISO's name is the one that run was for. A
      # release tag's commit has to be on agentv too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.which.outputs.publish == 'true' && github.event_name != 'schedule'
        with:
          sparse-checkout: bin
          persist-credentials: false

      - name: Check the run that kept it
        if: steps.which.outputs.publish == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.which.outputs.channel }}
          REPO: ${{ steps.which.outputs.repo }}
          RUN_ID: ${{ steps.which.outputs.run-id }}
          NAME: ${{ steps.which.outputs.name }}
        run: |
          set -o pipefail
          bin/agentv-iso-kept "$CHANNEL" "$REPO" "$RUN_ID" "$NAME" | tee -a "$GITHUB_STEP_SUMMARY"

  # The checksum the build left beside its ISO, checked: it has to name an
  # ISO of this channel. The ISO keeps that name. No secrets here.
  sum:
    name: "The ISO's checksum"
    needs: which
    if: needs.which.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    env:
      CHANNEL: ${{ needs.which.outputs.channel }}
      NAME: ${{ needs.which.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: bin
          persist-credentials: false

      # A run keeps the checksum on its own too, so this needn't fetch the
      # ISO. An older run didn't: then the ISO comes with it, and is checked.
      - name: Fetch the checksum
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository_owner }}/${{ needs.which.outputs.repo }}
          RUN_ID: ${{ needs.which.outputs.run-id }}
        run: |
          if ! gh run download "$RUN_ID" -R "$REPO" -n "$NAME.sha256" -D "$RUNNER_TEMP/iso"; then
            echo "That run kept no checksum on its own, so the ISO comes too."
            gh run download "$RUN_ID" -R "$REPO" -n "$NAME" -D "$RUNNER_TEMP/iso"
            (cd "$RUNNER_TEMP/iso" && sha256sum -c "$NAME.iso.sha256")
          fi

      - name: Check it names this channel's ISO
        run: |
          set -o pipefail
          bin/agentv-iso-publish names "$CHANNEL" "$RUNNER_TEMP/iso/$NAME.iso.sha256" names | tee -a "$GITHUB_STEP_SUMMARY"

      # The list the signing job checks the files against. Its own checksum
      # goes to that job as this job's output, not with the files.
      - name: Write down what was made
        id: sums
        run: |
          (cd names && sha256sum "$NAME.iso.sha256") >SHA256SUMS
          echo "sums=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: names-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            names/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # The only job that has the signing key. It fetches nothing but the small
  # files the job above made.
  sign:
    name: "Sign the checksum"
    needs: [which, sum]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: release
    env:
      NAME: ${{ needs.which.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            bin
            configs/airootfs/usr/share/agentv-iso
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: names-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check the files are the ones the job before made
        env:
          SUMS: ${{ needs.sum.outputs.sums }}
        run: |
          echo "$SUMS  SHA256SUMS" | sha256sum -c -
          (cd names && sha256sum -c ../SHA256SUMS)

      # Until the release environment has AGENTV_SIGNING_KEY, the ISO goes
      # out with its checksum unsigned, and the run says so. Once it has
      # the key, take the first branch out, so a missing key stops the run.
      - name: Sign
        env:
          AGENTV_SIGNING_KEY: ${{ secrets.AGENTV_SIGNING_KEY }}
        run: |
          set -o pipefail
          if [[ -z $AGENTV_SIGNING_KEY ]]; then
            echo "::warning title=The ISO's checksum isn't signed::The release environment has no AGENTV_SIGNING_KEY, so $NAME.iso goes out without $NAME.iso.sha256.sig."
            {
              echo "## The checksum is NOT signed"
              echo
              echo "This repo's \`release\` environment has no \`AGENTV_SIGNING_KEY\`, so \`$NAME.iso\` is published without \`$NAME.iso.sha256.sig\`. Add the secret, then run this workflow again for the same ISO."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bin/agentv-iso-sign "names/$NAME.iso.sha256" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-names-${{ github.run_id }}-${{ github.run_attempt }}
          path: names/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: "Publish the ISO"
    needs: [which, sign]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    environment: release
    permissions:
      # contents: write is for the download link and the checksum in the
      # release's notes.
      contents: write
      actions: read
    env:
      CHANNEL: ${{ needs.which.outputs.channel }}
      NAME: ${{ needs.which.outputs.name }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      ISO_URL: ${{ vars.ISO_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-names-${{ github.run_id }}-${{ github.run_attempt }}
          path: names

      - name: Fetch the kept ISO
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository_owner }}/${{ needs.which.outputs.repo }}
          RUN_ID: ${{ needs.which.outputs.run-id }}
        run: |
          echo "Free: $(df -BG --output=avail "$RUNNER_TEMP" | tail -1)"
          gh run download "$RUN_ID" -R "$REPO" -n "$NAME" -D "$RUNNER_TEMP/iso"
          ls -l "$RUNNER_TEMP/iso"

      # A signature counts only from the key this repo pins, the one the
      # ISO's own packages are checked against. Its public half comes from
      # agentv-keyring, in agentv-pkgs.
      - name: Check the signature
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          sum="names/$NAME.iso.sha256"
          if [[ ! -f $sum.sig ]]; then
            echo "::warning title=The ISO's checksum isn't signed::$NAME.iso is published without a signature."
            exit 0
          fi
          pinned=$(tr -d '[:space:]' <configs/airootfs/usr/share/agentv-iso/key-fingerprint)
          work=$(mktemp -d)
          export GNUPGHOME="$work/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          curl -fsSL --retry 5 --retry-delay 10 -o "$work/agentv.asc" \
            "https://raw.githubusercontent.com/$OWNER/agentv-pkgs/main/agentv-keyring/agentv.gpg"
          gpg --batch --quiet --import "$work/agentv.asc"
          gpg --batch --export "$pinned" >"$work/pinned.gpg"
          [[ -s $work/pinned.gpg ]] || { echo "::error::agentv-keyring doesn't carry the key this repo pins ($pinned)"; exit 1; }
          gpgv --quiet --keyring "$work/pinned.gpg" "$sum.sig" "$sum"
          echo "The checksum is signed by \`$pinned\`." >>"$GITHUB_STEP_SUMMARY"

      # Checks the ISO against the checksum first, then asks the bucket for
      # each file's size after. Only then does the channel's .json file move
      # to this ISO.
      - name: Upload it
        id: upload
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          url=$(bin/agentv-iso-publish upload "$CHANNEL" "$RUNNER_TEMP/iso/$NAME.iso" names)
          echo "url=$url" >>"$GITHUB_OUTPUT"
          {
            echo "Download: $url"
            echo
            echo "The link that doesn't change: ${ISO_URL%/}/iso/$CHANNEL.json"
            echo
            echo '```'
            cat "names/$NAME.iso.sha256"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The release's own page here is where people find the stable ISO, so
      # its notes get the download link. The checksum goes beside it: a
      # second place for it, one the bucket's keys can't change.
      - name: Put the download link and the checksum in the release's notes
        if: needs.which.outputs.channel != 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          version=${NAME#agentv-}
          version=${version%-x86_64}
          read -r hash _ <"names/$NAME.iso.sha256"
          link="Download the ISO: [$NAME.iso]($URL)"
          line="SHA-256 of the ISO: \`$hash\`"
          if ! body=$(gh release view "v$version" -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null); then
            {
              echo "There's no release for v$version here yet. When there is, put these in its notes:"
              echo
              echo "$link"
              echo
              echo "$line"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qF "$hash" <<<"$body" && grep -qF "$link" <<<"$body"; then
            echo "The release's notes have the download link and the checksum already."
            exit 0
          fi
          # The ones from an earlier publish of this version go.
          body=$(grep -v -e '^Download the ISO: ' -e '^SHA-256 of the ISO: ' <<<"$body" || true)
          printf '%s\n\n%s\n\n%s\n' "$body" "$link" "$line" >"$RUNNER_TEMP/notes.md"
          gh release edit "v$version" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "The download link and the checksum are in v$version's release notes." | tee -a "$GITHUB_STEP_SUMMARY"

      # What the next step would remove: the ISO this channel had before,
      # and nothing removed yet. If the bucket's listing isn't whole, or the
      # list is longer than it should ever be, this fails and the next step
      # doesn't run.
      - name: The ISO this one replaces (nothing is removed yet)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          bin/agentv-iso-publish stale "$CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove it, one file at a time
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          bin/agentv-iso-publish clean "$CHANNEL" | tee -a "$GITHUB_STEP_SUMMARY"
